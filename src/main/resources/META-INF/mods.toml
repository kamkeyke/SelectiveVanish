modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="svanish_icon.png"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''
issueTrackerURL="https://github.com/kamkeyke/SelectiveVanish/issues"

## Dependencies
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="raccooncore"
mandatory=true
versionRange="${raccooncore_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="vmod"
mandatory=true
versionRange="${vanishmod_version_range}"
ordering="NONE"
side="SERVER"